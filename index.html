let currentContent = '';
let currentFile = '';

function scoreClass(item, type) {
  return item.type === type ? 'score-green' : 'score-red';
}

function scoreLabel(type) {
  const labels = { prompt: 'Prompt', skill: 'Skill', agent: 'Agente' };
  return labels[type] || type;
}

function render() {
  document.getElementById('totalCount').textContent = DATA.length;
  const chapters = {};
  DATA.forEach(item => {
    if (!chapters[item.chapter]) chapters[item.chapter] = [];
    chapters[item.chapter].push(item);
  });
  Object.keys(chapters).forEach(ch => {
    const grid = document.getElementById('grid-' + ch);
    const badge = document.getElementById('count-' + ch);
    if (!grid) return;
    badge.textContent = chapters[ch].length;
    chapters[ch].forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-scores">
          <span class="score ${scoreClass(item, 'prompt')}">📝 Prompt ${item.promptScore}/10</span>
          <span class="score ${scoreClass(item, 'skill')}">⚡ Skill ${item.skillScore}/10</span>
          <span class="score ${scoreClass(item, 'agent')}">🤖 Agente ${item.agentScore}/10</span>
        </div>
        <div class="card-meta"><span class="file">${item.file}</span></div>
      `;
      card.onclick = () => openModal(item);
      grid.appendChild(card);
    });
  });
}

function openModal(item) {
  currentFile = item.file;
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalFile').textContent = '📄 ' + item.chapter + '/' + item.file;
  document.getElementById('modalBody').innerHTML = '<div class="loading">Cargando contenido...</div>';
  document.getElementById('modal').classList.add('active');
  document.getElementById('copyBtn').className = 'copy-btn';
  document.getElementById('copyBtn').textContent = 'Copiar contenido';
  loadContent(item);
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function loadContent(item) {
  const body = document.getElementById('modalBody');
  const folderMap = {
    'Business Discovery': 'business-discovery',
    'Diseño de soluciones': 'diseno-de-soluciones',
    'SEO': 'seo',
    'Research': 'research'
  };
  const folder = folderMap[item.chapter];
  const path = folder + '/' + item.file;
  fetch(encodeURI(path))
    .then(r => {
      if (!r.ok) throw new Error('No se pudo cargar el archivo');
      return r.text();
    })
    .then(text => {
      currentContent = text;
      body.innerHTML = '<pre>' + escapeHtml(text) + '</pre>';
    })
    .catch(err => {
      body.innerHTML = '<div class="error">Error al cargar: ' + err.message + '</div>';
    });
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyContent() {
  if (!currentContent) return;
  navigator.clipboard.writeText(currentContent).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '¡Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar contenido'; btn.classList.remove('copied'); }, 2000);
  });
}

document.getElementById('modal').onclick = function(e) { if (e.target === this) closeModal(); };
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

render();
</script>
</body>
